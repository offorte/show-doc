name: Deploy Pages

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag, branch, or commit to deploy.
        required: true
        default: main
        type: string

concurrency:
  group: pages-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ShowDoc example
    if: github.repository == 'offorte/show-doc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out deployment ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production showcase
        run: pnpm build && node scripts/prepare-preview.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .preview

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
