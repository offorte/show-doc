name: Release package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare GitHub release
    if: github.repository == 'offorte/show-doc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish_package:
    name: Publish package to npm
    needs: prepare_release
    if: needs.prepare_release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare_release.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify release
        run: pnpm agent:check

      - name: Publish public package
        run: npm publish --access public

  refresh_cdn:
    name: Refresh jsDelivr latest files
    needs: [prepare_release, publish_package]
    if: needs.prepare_release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}

    steps:
      - name: Purge files when jsDelivr knows the release
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          resolved_url="https://data.jsdelivr.com/v1/packages/npm/@offorte/show-doc/resolved?specifier=latest"
          cdn_path="npm/@offorte/show-doc@latest/dist"

          # jsDelivr throttles repeat purges of a path, so wait for the release and purge only once.
          # npm can list a release minutes late. jsDelivr's data API then caches npm data twice for 5 minutes.
          for attempt in {1..40}; do
            resolved="$(curl -sS "$resolved_url" | jq -r .version || true)"
            echo "Attempt $attempt: jsDelivr resolves latest to ${resolved:-no version}, expected $VERSION"
            [ "$resolved" = "$VERSION" ] && break
            sleep 30
          done
          if [ "$resolved" != "$VERSION" ]; then
            echo "::error::jsDelivr does not resolve latest to $VERSION. Purge the files by hand."
            exit 1
          fi

          for bundle in showdoc.js showdoc-mermaid.js; do
            curl -fsS "https://purge.jsdelivr.net/$cdn_path/$bundle" || true
          done

          for attempt in {1..10}; do
            stale=0
            for bundle in showdoc.js showdoc-mermaid.js; do
              served="$(curl -sSI "https://cdn.jsdelivr.net/$cdn_path/$bundle" | tr -d '\r' | awk 'tolower($1) == "x-jsd-version:" { print $2 }')"
              echo "Attempt $attempt: $bundle serves ${served:-no version}, expected $VERSION"
              [ "$served" = "$VERSION" ] || stale=1
            done
            [ "$stale" -eq 0 ] && exit 0
            sleep 30
          done

          echo "::error::jsDelivr does not serve $VERSION for @latest. The purge can be throttled. Purge the files by hand."
          exit 1

  deploy_pages:
    name: Deploy released Pages site
    needs:
      - prepare_release
      - publish_package
    if: needs.prepare_release.outputs.release_created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.prepare_release.outputs.tag_name }}
